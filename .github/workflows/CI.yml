name: CI

on:
  workflow_dispatch: # Allow running the workflow manually from the GitHub UI
  push:
    branches:
      - develop # Run on commits to develop branch
  pull_request:
    branches:
      - develop # Run on pull requests to develop
      - master # Run on pull requests to master

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 5.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "5.x.x"

      - name: Setup .NET 6.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "6.x.x"

      - name: Setup .NET 7.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "7.x.x"

      - name: Setup .NET 8.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.x.x"

      - name: Setup .NET 9.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.x.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --configuration Release --no-restore

      - name: Run tests
        run: |
          # Test the latest framework first as primary validation
          echo "Running tests for .NET 9.0 (primary)..."
          dotnet test PersianDate.sln --framework net9.0 --no-restore --verbosity normal --configuration Release

          # Test other frameworks for compatibility
          echo "Running tests for .NET 8.0..."
          dotnet test PersianDate.sln --framework net8.0 --no-restore --verbosity normal --configuration Release

          echo "Running tests for .NET 7.0..."
          dotnet test PersianDate.sln --framework net7.0 --no-restore --verbosity normal --configuration Release

          echo "Running tests for .NET 6.0..."
          dotnet test PersianDate.sln --framework net6.0 --no-restore --verbosity normal --configuration Release

          echo "Running tests for .NET 5.0..."
          dotnet test PersianDate.sln --framework net5.0 --no-restore --verbosity normal --configuration Release

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults/**/*
